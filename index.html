<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Kabel Listrik</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

  :root{
    --bg:#faf6ee; --panel:#ffffff; --panel-2:#f4efe2; --paper:#2b2118;
    --copper:#b5661f; --copper-bright:#d97f2e; --teal:#2f6b62;
    --text:#3a342a; --text-dim:#8a8072; --line:#e6ddc8;
  }
  :root[data-theme="dark"]{
    --bg:#0d1117; --panel:#151b23; --panel-2:#1c2530; --paper:#f2ede1;
    --copper:#c17a4a; --copper-bright:#e08f52; --teal:#4f8f86;
    --text:#d8d3c4; --text-dim:#8a8f98; --line:#2a3441;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    transition:background-color 0.2s, color 0.2s;
    overflow:hidden;
  }

  .shell{display:flex; height:100vh; height:100dvh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:272px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:20px 16px; overflow-y:auto;
    transition:background-color 0.2s, border-color 0.2s, transform 0.2s ease;
  }
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:4px;}
  .brand svg{flex-shrink:0;}
  .brand h1{font-size:1.02rem; font-weight:700; margin:0; color:var(--paper); line-height:1.25;}
  .brand .sub{font-family:'IBM Plex Mono', monospace; font-size:0.62rem; color:var(--text-dim); margin-top:2px; letter-spacing:0.01em;}

  .sidebar-tools{display:flex; align-items:center; gap:8px; margin:16px 0 6px;}
  .theme-toggle, .close-sidebar{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:0.95rem;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .theme-toggle:hover, .close-sidebar:hover{border-color:var(--copper);}
  .close-sidebar{display:none;}

  .nav-label{
    font-family:'IBM Plex Mono', monospace; font-size:0.65rem; color:var(--text-dim);
    text-transform:uppercase; letter-spacing:0.08em; margin:18px 4px 8px;
  }
  nav{display:flex; flex-direction:column; gap:4px; flex:1;}
  .nav-item{
    display:flex; align-items:center; gap:11px;
    padding:9px 10px; border-radius:7px; cursor:pointer;
    border:1px solid transparent; text-align:left; background:none;
    color:var(--text); font-family:'Space Grotesk', sans-serif;
  }
  .nav-item:hover{background:var(--panel-2);}
  .nav-item .dot{
    width:7px; height:7px; border-radius:50%; background:var(--line); flex-shrink:0;
    transition:background-color 0.15s;
  }
  .nav-item .label{font-size:0.85rem; line-height:1.3;}
  .nav-item.active{background:var(--panel-2); border-color:var(--copper);}
  .nav-item.active .dot{background:var(--copper-bright);}
  .nav-item.active .label{color:var(--paper); font-weight:600;}

  .install-btn{
    margin-top:16px; background:var(--copper); color:#fff9ef; border:none; border-radius:6px;
    padding:10px 14px; font-family:'Space Grotesk', sans-serif; font-size:0.8rem; font-weight:600;
    cursor:pointer; letter-spacing:0.01em;
  }
  .install-btn:hover{background:var(--copper-bright);}
  .install-btn.hidden{display:none;}

  .sidebar-footer{
    font-family:'IBM Plex Mono', monospace; font-size:0.65rem; color:var(--text-dim);
    margin-top:16px; padding-top:14px; border-top:1px solid var(--line); line-height:1.6;
  }

  /* ---------- Main / content ---------- */
  .main{flex:1; min-width:0; display:flex; flex-direction:column; height:100%;}

  .topbar{
    display:none; align-items:center; gap:12px; padding:12px 16px;
    border-bottom:1px solid var(--line); background:var(--panel); flex-shrink:0;
  }
  .hamburger{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    width:36px; height:36px; border-radius:7px; cursor:pointer; font-size:1rem;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .topbar .current{font-size:0.9rem; font-weight:600; color:var(--paper);}

  .content{flex:1; min-height:0; position:relative;}
  #calcFrame{
    width:100%; height:100%; border:none; display:none; background:var(--bg);
  }

  .welcome{
    height:100%; overflow-y:auto; display:flex; align-items:center; justify-content:center; padding:40px 24px;
  }
  .welcome-inner{max-width:420px; text-align:center;}
  .welcome-inner .icon{margin:0 auto 18px;}
  .welcome-inner h2{font-size:1.3rem; font-weight:700; color:var(--paper); margin:0 0 8px;}
  .welcome-inner p{font-size:0.88rem; color:var(--text-dim); line-height:1.6; margin:0;}

  .backdrop{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:40;}

  @media (max-width:860px){
    .topbar{display:flex;}
    .close-sidebar{display:flex;}
    .sidebar{
      position:fixed; top:0; left:0; bottom:0; z-index:50; width:82vw; max-width:300px;
      transform:translateX(-100%); box-shadow:0 0 24px rgba(0,0,0,0.2);
    }
    body.sidebar-open .sidebar{transform:translateX(0);}
    body.sidebar-open .backdrop{display:block;}
  }
</style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#b5661f">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="50" cy="50" r="47" fill="var(--panel-2)" stroke="var(--line)" stroke-width="2"/>
        <circle cx="50" cy="50" r="37" fill="#fffdf8" stroke="var(--line)" stroke-width="1.5"/>
        <circle cx="50" cy="50" r="9" fill="var(--copper-bright)" stroke="var(--bg)" stroke-width="1.5"/>
        <circle cx="50" cy="32" r="9" fill="var(--copper)" stroke="var(--bg)" stroke-width="1.5"/>
        <circle cx="65.6" cy="41" r="9" fill="var(--copper-bright)" stroke="var(--bg)" stroke-width="1.5"/>
        <circle cx="65.6" cy="59" r="9" fill="var(--copper)" stroke="var(--bg)" stroke-width="1.5"/>
        <circle cx="50" cy="68" r="9" fill="var(--copper-bright)" stroke="var(--bg)" stroke-width="1.5"/>
        <circle cx="34.4" cy="59" r="9" fill="var(--copper)" stroke="var(--bg)" stroke-width="1.5"/>
        <circle cx="34.4" cy="41" r="9" fill="var(--copper-bright)" stroke="var(--bg)" stroke-width="1.5"/>
      </svg>
      <div>
        <h1>Kalkulator Kabel Listrik</h1>
        <div class="sub">Voltage Drop, Dihitung Benar.</div>
      </div>
    </div>

    <div class="sidebar-tools">
      <button class="theme-toggle" id="themeToggle" title="Ganti tema" aria-label="Ganti tema">🌙</button>
      <button class="close-sidebar" id="closeSidebar" title="Tutup menu" aria-label="Tutup menu">✕</button>
    </div>

    <div class="nav-label">Kalkulator</div>
    <nav id="navList">
      <button class="nav-item" data-src="voltage-drop.html" data-name="Voltage Drop">
        <span class="dot"></span><span class="label">Voltage Drop</span>
      </button>
      <button class="nav-item" data-src="short-circuit.html" data-name="Short Circuit Withstand Current">
        <span class="dot"></span><span class="label">Short Circuit Withstand Current</span>
      </button>
      <button class="nav-item" data-src="conductor.html" data-name="Database Konduktor & Harga">
        <span class="dot"></span><span class="label">Database Konduktor &amp; Harga</span>
      </button>
      <button class="nav-item" data-src="drum.html" data-name="Panjang Kabel dalam Drum">
        <span class="dot"></span><span class="label">Panjang Kabel dalam Drum</span>
      </button>
      <button class="nav-item" data-src="short-circuit-screen.html" data-name="Short Circuit Screen">
        <span class="dot"></span><span class="label">Short Circuit Screen</span>
      </button>
      <button class="nav-item" data-src="braid-coverage.html" data-name="Coverage Braid & Berat Material">
        <span class="dot"></span><span class="label">Coverage Braid &amp; Berat Material</span>
      </button>
      <button class="nav-item" data-src="tensile-test.html" data-name="Uji Tarik & Elongasi Kabel">
        <span class="dot"></span><span class="label">Uji Tarik &amp; Elongasi Kabel</span>
      </button>
      <button class="nav-item" data-src="fire-test.html" data-name="Extra Length Uji Bakar">
        <span class="dot"></span><span class="label">Extra Length Uji Bakar</span>
      </button>
      <button class="nav-item" data-src="cr-test.html" data-name="Uji Conductor Resistance Lapangan">
        <span class="dot"></span><span class="label">Uji Conductor Resistance Lapangan</span>
      </button>
      <button class="nav-item" data-src="power-to-ampere.html" data-name="Konversi Daya ke Ampere">
        <span class="dot"></span><span class="label">Konversi Daya ke Ampere</span>
      </button>
    </nav>

    <button class="install-btn hidden" id="installBtn">📲 Install App</button>
    <div class="sidebar-footer">Gratis, bebas dipakai siapa saja.</div>
  </aside>

  <div class="backdrop" id="backdrop"></div>

  <main class="main">
    <div class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Buka menu">☰</button>
      <div class="current" id="currentName">Kalkulator Kabel Listrik</div>
    </div>

    <div class="content">
      <div class="welcome" id="welcome">
        <div class="welcome-inner">
          <svg class="icon" width="52" height="52" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="50" cy="50" r="47" fill="var(--panel-2)" stroke="var(--line)" stroke-width="2"/>
            <circle cx="50" cy="50" r="37" fill="#fffdf8" stroke="var(--line)" stroke-width="1.5"/>
            <circle cx="50" cy="50" r="9" fill="var(--copper-bright)" stroke="var(--bg)" stroke-width="1.5"/>
            <circle cx="50" cy="32" r="9" fill="var(--copper)" stroke="var(--bg)" stroke-width="1.5"/>
            <circle cx="65.6" cy="41" r="9" fill="var(--copper-bright)" stroke="var(--bg)" stroke-width="1.5"/>
            <circle cx="65.6" cy="59" r="9" fill="var(--copper)" stroke="var(--bg)" stroke-width="1.5"/>
            <circle cx="50" cy="68" r="9" fill="var(--copper-bright)" stroke="var(--bg)" stroke-width="1.5"/>
            <circle cx="34.4" cy="59" r="9" fill="var(--copper)" stroke="var(--bg)" stroke-width="1.5"/>
            <circle cx="34.4" cy="41" r="9" fill="var(--copper-bright)" stroke="var(--bg)" stroke-width="1.5"/>
          </svg>
          <h2>Pilih kalkulator</h2>
          <p>Klik salah satu kalkulator di menu kiri untuk mulai — hasilnya akan tampil di sini.</p>
        </div>
      </div>
      <iframe id="calcFrame" title="Kalkulator" src=""></iframe>
    </div>
  </main>
</div>

<script>
  // ---------- Theme ----------
  const themeToggle = document.getElementById('themeToggle');
  const calcFrame = document.getElementById('calcFrame');

  function terapkanTema(tema, syncFrame){
    document.documentElement.setAttribute('data-theme', tema);
    themeToggle.textContent = tema === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('cable_theme', tema);
    if (syncFrame){
      try{
        const doc = calcFrame.contentDocument;
        if (doc && doc.documentElement) doc.documentElement.setAttribute('data-theme', tema);
      }catch(e){}
    }
  }
  themeToggle.addEventListener('click', () => {
    const skrg = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    terapkanTema(skrg, true);
  });
  terapkanTema(localStorage.getItem('cable_theme') || 'light', false);

  // ---------- Navigation ----------
  const navItems = Array.from(document.querySelectorAll('.nav-item'));
  const welcome = document.getElementById('welcome');
  const currentName = document.getElementById('currentName');

  function bukaKalkulator(src, nama, item){
    calcFrame.src = src;
    calcFrame.style.display = 'block';
    welcome.style.display = 'none';
    currentName.textContent = nama;
    navItems.forEach(n => n.classList.remove('active'));
    if (item) item.classList.add('active');
    localStorage.setItem('cable_last_calc', src);
    tutupSidebarMobile();
  }

  navItems.forEach(item => {
    item.addEventListener('click', () => {
      bukaKalkulator(item.dataset.src, item.dataset.name, item);
    });
  });

  calcFrame.addEventListener('load', () => {
    const tema = document.documentElement.getAttribute('data-theme');
    try{
      const doc = calcFrame.contentDocument;
      if (doc && doc.documentElement) doc.documentElement.setAttribute('data-theme', tema);
    }catch(e){}
  });

  const lastCalc = localStorage.getItem('cable_last_calc');
  if (lastCalc){
    const match = navItems.find(n => n.dataset.src === lastCalc);
    if (match) bukaKalkulator(lastCalc, match.dataset.name, match);
  }

  // ---------- Mobile sidebar ----------
  const hamburger = document.getElementById('hamburger');
  const closeSidebar = document.getElementById('closeSidebar');
  const backdrop = document.getElementById('backdrop');

  function bukaSidebarMobile(){ document.body.classList.add('sidebar-open'); }
  function tutupSidebarMobile(){ document.body.classList.remove('sidebar-open'); }

  hamburger.addEventListener('click', bukaSidebarMobile);
  closeSidebar.addEventListener('click', tutupSidebarMobile);
  backdrop.addEventListener('click', tutupSidebarMobile);

  // ---------- Install PWA ----------
  let deferredPrompt;
  const installBtn = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.classList.remove('hidden');
  });
  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.classList.add('hidden');
  });
  window.addEventListener('appinstalled', () => {
    installBtn.classList.add('hidden');
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(console.error);
    });
  }
</script>
</body>
</html>
